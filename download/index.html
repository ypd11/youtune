    <style>
        :root {
            --accent: #f97316;
            --accent-hover: #ea580c;

            --text-dark: #1e293b;
            --text-grey: #64748b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --header-bg: #2c3e50;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* Header */
        .download-header {
            text-align: center;
            padding: 80px 20px;
            background: var(--header-bg);
            color: white;
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .logo-icon-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        .download-header h1 {
            font-size: 2.5rem;
            color: white;
            margin: 0;
            letter-spacing: -0.02em;
            font-weight: 800;
        }

        .download-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.15rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Container */
        .container {
            max-width: 800px;
            margin: -40px auto 60px;
            padding: 0 20px;
            text-align: center;
        }

        /* Download Grid */
        .download-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* Cards */
        .download-card {
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            padding: 40px 30px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: inherit;
        }

        .download-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .platform-icon {
            margin-bottom: 20px;
        }

        .platform-icon svg {
            width: 48px;
            height: 48px;
            fill: var(--accent);
        }

        .download-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .download-card p {
            color: var(--text-grey);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        /* Button */
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--accent);
            color: white;
            padding: 16px 0;
            width: 100%;
            border-radius: 999px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.2s;
            text-decoration: none;
            box-shadow: 0 4px 6px -1px rgba(249, 115, 22, 0.3);
            cursor: pointer;
        }

        .download-btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.4);
            transform: scale(1.02);
        }

        /* Footer */
        .footer-note {
            margin-top: 80px;
            padding-top: 40px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-grey);
            font-size: 0.9rem;
        }

        /* --- Mobile Optimizations --- */
        @media (max-width: 640px) {
            .download-header {
                padding: 40px 15px 60px;
            }

            .download-header h1 {
                font-size: 1.75rem;
            }

            .download-header p {
                font-size: 0.95rem;
            }

            .container {
                margin-top: -25px;
                padding: 0 12px;
            }

            .download-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .download-card {
                padding: 20px 16px; /* Significantly reduced card size */
                border-radius: 16px;
            }

            .platform-icon {
                margin-bottom: 12px;
            }

            .platform-icon svg {
                width: 32px; /* Smaller icons */
                height: 32px;
            }

            .download-card h2 {
                font-size: 1.2rem;
                margin-bottom: 4px;
            }

            .download-card p {
                font-size: 0.85rem;
                margin-bottom: 16px;
            }

            .download-btn {
                padding: 12px 0;
                font-size: 0.9rem;
            }

            .footer-note {
                margin-top: 30px;
            }
        }
    </style>
</head>
